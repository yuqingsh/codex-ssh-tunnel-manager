# macOS 本机配置模板。
# 复制为 config/tunnels.macos.conf 后再按本机情况修改。
# 此文件使用简单 KEY=VALUE 格式，不会被当作 shell 脚本执行。

SCHEMA_VERSION=1
POLL_SECONDS=5
STOP_GRACE_MINUTES=10
PROXY_WAIT_SECONDS=120
LOCAL_PROXY_HOST=127.0.0.1
LOCAL_PROXY_PORT=7897
REMOTE_PROXY_HOST=127.0.0.1
REMOTE_PROXY_PORT=17897
CONTROLLER_LABEL=com.codex.ssh-tunnel-manager.controller
TUNNEL_LABEL_PREFIX=com.codex.ssh-tunnel-manager.tunnel
TUNNEL_NAMES=primary,secondary

TUNNEL_PRIMARY_DEV_ALIAS=primary-dev
TUNNEL_PRIMARY_PROXY_ALIAS=primary-proxy

TUNNEL_SECONDARY_DEV_ALIAS=secondary-dev
TUNNEL_SECONDARY_PROXY_ALIAS=secondary-proxy
