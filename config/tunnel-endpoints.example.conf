# Linux 端 Codex SSH 隧道代理端点列表模板。
#
# 部署时复制到 ~/.config/codex-ssh-tunnel-manager/endpoints.conf（该路径不在
# 仓库内），或直接由 scripts/linux/install-codex-wrapper.sh --endpoint URL 生成。
#
# 每行一个端点，格式必须为 http://127.0.0.1:<1-65535>；空行和以 # 开头的行会被忽略。
# Codex wrapper 按顺序探测这些端点（curl 成功且 HTTP 状态码 >= 100 即视为健康），
# 选择第一个可用的端点；全部不可用时回退到第一个端点，并在状态日志
# ${XDG_STATE_HOME:-$HOME/.local/state}/codex/ssh-tunnel-manager/ 中记录告警。
#
# 同一台 Linux 开发机上，每台客户端必须占用不同的远端回环端口，否则后连接的隧道
# 会因端口已被占用而无法建立。约定：
#   Windows 客户端：17897
#   macOS 客户端：17898
#   更多客户端：17899 及以后
http://127.0.0.1:17897
http://127.0.0.1:17898
